<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="/myapp-shield.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#1E3A5F" />
		<meta name="description" content="MyApp" id="meta-description" />

		<link rel="manifest" href="/manifest.json" />
		<title>MyApp</title>
	</head>
	<body>
		<div id="root"></div>
		<script src="/config.js"></script>
		<script type="module" src="/src/index.tsx"></script>
		<script>
			// Hydrate meta tags from env vars injected by Vite at build time
			(function () {
				var metaDesc = '%VITE_META_DESC%' !== '' ? '%VITE_META_DESC%' : 'MyApp';
				var siteName = '%VITE_SITE_NAME%' !== '' ? '%VITE_SITE_NAME%' : 'MyApp';

				document.getElementById('meta-description')?.setAttribute('content', metaDesc);
				document.title = siteName;
			})();
		</script>
	</body>
</html>
